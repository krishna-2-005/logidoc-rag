# LogiDoc-RAG behind nginx with a Let's Encrypt certificate from certbot
# (docs/PRODUCTION_DEPLOYMENT.md). Replace logidoc.example.com everywhere.
#
#   sudo certbot certonly --webroot -w /var/www/certbot -d logidoc.example.com
#
# certbot installs a timer that renews the certificate; reload nginx after a
# renewal with --deploy-hook "systemctl reload nginx". No certificate or key
# is stored in this repository.

# Rate limits at the proxy (docs/RATE_LIMITING.md), per client address, in front of the application's own
# finer limits (failed sign-ins, report downloads, audit jobs...). These zones belong to the http context:
# this file is included there (sites-enabled/ or conf.d/). Refused requests get 429, like the application's.
limit_req_zone $binary_remote_addr zone=logidoc_sign_in:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=logidoc_api:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name logidoc.example.com;

    # certbot's HTTP challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name logidoc.example.com;

    ssl_certificate     /etc/letsencrypt/live/logidoc.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logidoc.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:LogiDocSSL:10m;
    ssl_session_tickets off;

    # The whole-upload limit: LOGIDOC_MAX_UPLOAD_FILES x LOGIDOC_MAX_UPLOAD_MB + 1 MB (20 x 25 + 1 by default)
    client_max_body_size 501m;

    # The metrics stay on the machine (they need an administrator's session anyway)
    location /api/admin/metrics {
        return 404;
    }

    # Every sign-in, successful or not (the application also limits failed ones: 10 a minute per client)
    location ~ ^/api(/v1)?/auth/login$ {
        limit_req zone=logidoc_sign_in burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # The address nginx sees, replacing any X-Forwarded-For the client sent: the API trusts this header
        # from 127.0.0.1 only (LOGIDOC_FORWARDED_ALLOW_IPS), and its own rate limits use the address in it
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
    }

    # The API: a page of the web application makes several requests at once, hence the burst
    location /api/ {
        limit_req zone=logidoc_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # The address nginx sees, replacing any X-Forwarded-For the client sent: the API trusts this header
        # from 127.0.0.1 only (LOGIDOC_FORWARDED_ALLOW_IPS), and its own rate limits use the address in it
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;

        # A generated answer may take up to LOGIDOC_LLM_TIMEOUT (120 s)
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # The web application's files
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # The address nginx sees, replacing any X-Forwarded-For the client sent: the API trusts this header
        # from 127.0.0.1 only (LOGIDOC_FORWARDED_ALLOW_IPS), and its own rate limits use the address in it
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
    }
}
